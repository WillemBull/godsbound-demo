  g.fillStyle="#8d8983";
  g.beginPath(); g.moveTo(x+s*0.02,y+s*0.5); g.lineTo(x+s*0.45,y-s*0.22); g.lineTo(x+s*0.8,y+s*0.5); g.closePath(); g.fill();
  g.fillStyle="#e8e6e1";
  g.beginPath(); g.moveTo(x-s*0.1,y-s*0.55); g.lineTo(x+s*0.07,y-s*0.28); g.lineTo(x-s*0.3,y-s*0.28); g.closePath(); g.fill();
}

function hexPoly(g,cx,cy,s){
  g.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i);
    const x=cx+s*Math.cos(a), y=cy+s*Math.sin(a);
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath();
}
/* Same hexagon, pre-flattened by TILT_SQUASH in local space -- for ground-plane hex
   outlines drawn in draw()'s per-frame pass (which isn't under a canvas-level squash
   transform, unlike renderBG's terrain layer, so sprite/text drawing there stays
   undistorted). cx,cy must already be a toScreen()-projected point. */
function squashedHexPoly(g,cx,cy,s){
  g.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i);
    const x=cx+s*Math.cos(a), y=cy+s*Math.sin(a)*TILT_SQUASH;
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath();
}
/* Draws one faction's full-bleed arena background, "cover"-fit (aspect-preserving,
   centered, cropped to fill) into the given rect and clipped to it so it never bleeds
   into the other half. No chromaKeyed() -- see the IMG_SPRITES.arena_bg_* comment for
   why these opaque photos deliberately skip that step. */
function drawArenaBgRect(g,faction,x,y,w,h){
  const img=getSpriteImage("arena_bg_"+faction);
  g.save();
  g.beginPath(); g.rect(x,y,w,h); g.clip();
  if(img && img.complete && img.naturalWidth>0){
    const boxAspect=w/h, imgAspect=img.naturalWidth/img.naturalHeight;
    let dw,dh;
    if(imgAspect>boxAspect){ dh=h; dw=dh*imgAspect; } else { dw=w; dh=dw/imgAspect; }
    g.drawImage(img,x+w/2-dw/2,y+h/2-dh/2,dw,dh);
  } else {
    // still decoding (or missing) -- flat color matching that faction's old base
    // terrain look, so there's no blank/black flash while the real art loads in
    g.fillStyle = faction==="egypt" ? "#c7a15c" : "#6f8a41";
    g.fillRect(x,y,w,h);
  }
  g.restore();
}
/* Special terrain tiles (forest/mountain/water) are "simply placed on top" of the
   transparent hex grid -- a compact icon sized to sit within the hex, not a full-hex
   clipped fill (see the IMG_SPRITES terrain-art comment for why this is a deliberate
   change from the same-day earlier approach). Falls back to the original vector
   decorations if the image isn't loaded yet. R/H have no art and no vector
   decoration either at this point -- see terrain architecture note 2. */
function drawSpecialTile(g,T,cx,cy){
  const key = T==="F"?"terrain_shared_forest" : T==="M"?"terrain_shared_mountain" : T==="W"?"terrain_shared_water" : null;
  if(!key) return;
  const img=getSpriteImage(key);
  if(img && img.complete && img.naturalWidth>0){
    const src=chromaKeyed(img,key);
    const size=HEX*1.5; // comfortably within the hex's own ~1.7*HEX flat-to-flat extent
    const aspect=img.naturalWidth/img.naturalHeight;
    const dw=aspect>=1?size:size*aspect, dh=aspect>=1?size/aspect:size;
    g.drawImage(src,cx-dw/2,cy-dh/2,dw,dh);
    return;
  }
  if(T==="F"){
    vTree(g,cx-HEX*0.3,cy+HEX*0.18,HEX*0.5);
    vTree(g,cx+HEX*0.26,cy+HEX*0.32,HEX*0.62);
    vTree(g,cx-0.02*HEX,cy+HEX*0.52,HEX*0.44);
  } else if(T==="M"){ vMtn(g,cx,cy,HEX); }
  else if(T==="W"){
    g.fillStyle="rgba(160,220,240,.10)"; g.beginPath(); g.ellipse(cx,cy,HEX*0.55,HEX*0.34,0,0,7); g.fill();
    g.strokeStyle="rgba(190,235,255,.35)"; g.lineWidth=1;
    for(const dy of [-0.18,0.16]){ g.beginPath();
      g.moveTo(cx-HEX*.38,cy+HEX*dy); g.quadraticCurveTo(cx-HEX*.13,cy+HEX*(dy-.16),cx,cy+HEX*dy);
      g.quadraticCurveTo(cx+HEX*.13,cy+HEX*(dy+.16),cx+HEX*.38,cy+HEX*dy); g.stroke(); }
  }
}
function renderBG(){
  const g=bg.getContext("2d");
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,bg.width,bg.height);
  // ground plane (terrain hexes + the mid-board boundary) renders under a canvas-level
  // squash so the hex tiles themselves come out visually flattened -- restored below,
  // before the vignette, since a lens vignette isn't part of the tilted ground plane.
  const pivot=boardPivotY();
  g.save();
  g.translate(0,pivot); g.scale(1,TILT_SQUASH); g.translate(0,-pivot);
  // One full-bleed background per half of the arena (that half's controlling
  // faction's own art), THEN a transparent hex grid on top -- the background reads
  // as a single continuous scene, not a tiled mosaic of individually-textured hexes.
  // Top/bottom bounds must check BOTH column parities, not just column 0 -- odd
  // columns sit HEX*SQ3*0.5 lower than even columns in the same row (the odd-q
  // offset), so a bound taken only from column 0 undershoots the true bottom edge of
  // the last row by that much, leaving odd-column hexes there half-uncovered by the
  // background (this was a real bug, not just tight padding -- fixed 2026-07-20,
  // direct chat request: "let it over hang on either end of the arena because
  // currently the player's hexes on the bottom are only half filled"). Padding bumped
  // to a full HEX beyond that true bound as well, so the art visibly overhangs past
  // the arena's top/bottom edges instead of just barely reaching them.
  const bgLeft=hexCenter(0,0).x-HEX*1.3, bgRight=hexCenter(COLS-1,0).x+HEX*1.3;
  const bgTop=Math.min(hexCenter(0,0).y,hexCenter(1,0).y)-HEX*1.4;
  const bgBot=Math.max(hexCenter(0,TMAP.length-1).y,hexCenter(1,TMAP.length-1).y)+HEX*1.4;
  if(S.setupStep==="terrain"){
    // local half-board: entirely the player's own territory, one backdrop, no split
    drawArenaBgRect(g,factionForSide(0),bgLeft,bgTop,bgRight-bgLeft,bgBot-bgTop);
  } else {
    const midY=(hexCenter(0,5).y+hexCenter(0,6).y)/2;
    drawArenaBgRect(g,factionForSide(1),bgLeft,bgTop,bgRight-bgLeft,midY-bgTop);   // AI half (top)
    drawArenaBgRect(g,factionForSide(0),bgLeft,midY,bgRight-bgLeft,bgBot-midY);    // player half (bottom)
  }
  for(let r=0;r<TMAP.length;r++)for(let c=0;c<COLS;c++){
    const ct=hexCenter(c,r);
    hexPoly(g,ct.x,ct.y,HEX-0.6);
    g.strokeStyle="rgba(0,0,0,.32)"; g.lineWidth=2.4; g.stroke(); // dark base pass, keeps the line legible over light background areas
    hexPoly(g,ct.x,ct.y,HEX-0.6);
    g.strokeStyle="rgba(255,244,214,.65)"; g.lineWidth=1.1; g.stroke(); // distinct light grid line on top -- hexes are otherwise fully transparent
    drawSpecialTile(g,terrain(c,r),ct.x,ct.y);
  }
  if(S.setupStep!=="terrain"){
    const y=(hexCenter(0,5).y+hexCenter(0,6).y)/2;
    g.strokeStyle="rgba(255,255,255,.12)"; g.setLineDash([6,6]);
    g.beginPath(); g.moveTo(0,y); g.lineTo(bg.width/DPR,y); g.stroke(); g.setLineDash([]);
  }
  g.restore(); // back to the plain DPR transform -- the vignette below is a lens effect, not part of the tilted ground
  const VW=bg.width/DPR, VH=bg.height/DPR;
  const vg=g.createRadialGradient? g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.34,VW/2,VH/2,Math.max(VW,VH)*0.7):null;
  if(vg && vg.addColorStop){ vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.52)");
    g.fillStyle=vg; g.fillRect(0,0,VW,VH); }
}
function rrect(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function hpBar(x,y,w,frac,color){
  rrect(ctx,x-w/2-1,y-1.2,w+2,5.6,2.6);
  ctx.fillStyle="rgba(5,6,9,.88)"; ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.9)"; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle=color;
  ctx.fillRect(x-w/2,y,w*Math.max(0,Math.min(1,frac)),3.2);
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,board.width/DPR,board.height/DPR);
  ctx.drawImage(bg,0,0,board.width/DPR,board.height/DPR);
  const now=elapsed();
  /* Everything below reads a LOGICAL position (hexCenter/bldCenter/u.pos, all untouched)
     and projects it through toScreen() right before drawing -- ground-plane discs (wards,
     ring/boom/spawn effect bursts, building-hex footprint, unit shadow) additionally get
     their vertical radius squashed by TILT_SQUASH so they read as flat on the tilted
     ground; sprite art, building art, HP bars, and text/glyphs are translated to the
     projected anchor but drawn at their normal (unsquashed) local proportions -- exactly
     the same "project the anchor, not the content" rule renderBG's terrain layer achieves
     via a canvas-level transform instead (text-free, so that shortcut is safe there). */
  for(const w of S.wards){
    if(now>=w.until||w.charges<=0) continue;
    const ctL=hexCenter(w.c,w.r), ct=toScreen(ctL.x,ctL.y);
    const R=HEX*SQ3*w.rad*0.92;
    ctx.fillStyle="rgba(176,110,240,.16)"; ctx.strokeStyle="rgba(176,110,240,.6)";
    ctx.beginPath(); ctx.ellipse(ct.x,ct.y,R,R*TILT_SQUASH,0,0,7); ctx.fill(); ctx.stroke();
  }
  if(S.drag&&S.drag.spawnBld){
    const d=S.drag, bcL=bldCenter(d.spawnBld), bc=toScreen(bcL.x,bcL.y);
    ctx.strokeStyle=d.legal?"rgba(232,184,75,.9)":"rgba(255,70,60,.9)";
    ctx.lineWidth=3; ctx.lineJoin="round"; ctx.setLineDash([7,5]);
    ctx.beginPath(); ctx.moveTo(bc.x,bc.y);
    for(const h of d.path){ const ctL=hexCenter(h[0],h[1]), ct=toScreen(ctL.x,ctL.y); ctx.lineTo(ct.x,ct.y); }
    ctx.stroke(); ctx.setLineDash([]);
    if(d.path.length){ const eL=hexCenter(...d.path[d.path.length-1]), e=toScreen(eL.x,eL.y);
      ctx.fillStyle=d.legal?"#e8b84b":"#ff463c";
      ctx.beginPath(); ctx.arc(e.x,e.y,5,0,7); ctx.fill(); }
  }
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const activeBuildings = S.setupStep==="terrain" ? playerHalf.buildings : buildings;
  for(const b of activeBuildings){
    const cL=bldCenter(b), c=toScreen(cL.x,cL.y);
    for(const h of b.hexes){ const ctL=hexCenter(h[0],h[1]), ct=toScreen(ctL.x,ctL.y);
      squashedHexPoly(ctx,ct.x,ct.y,HEX-1);
      ctx.fillStyle=b.dead?"rgba(30,30,30,.55)":(b.side?"rgba(192,57,43,.28)":"rgba(232,184,75,.25)");
      ctx.fill();
      ctx.strokeStyle=b.side?"#c0392b":"#e8b84b"; ctx.lineWidth=1.5; ctx.stroke(); }
    drawBuilding(b,c);
    const lbl=b.name.toUpperCase();
    ctx.font=`bold ${Math.max(7,HEX*0.3)}px sans-serif`;
    const mm=ctx.measureText(lbl)||{width:HEX*1.4};
    const tw=(mm.width||HEX*1.4)+HEX*0.55, ly=c.y+HEX*0.86, lh=HEX*0.5;
    rrect(ctx,c.x-tw/2,ly,tw,lh,3);
    ctx.fillStyle="rgba(10,12,16,.85)"; ctx.fill();
    ctx.strokeStyle=b.side?"rgba(210,80,60,.85)":"rgba(232,184,75,.85)"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle="#ddd6c4"; ctx.fillText(lbl,c.x,ly+lh/2+0.5);
    if(!b.dead) hpBar(c.x,c.y-HEX*1.15,HEX*2.2,b.hp/b.maxhp,b.side?"#e74c3c":"#e8b84b");
  }
  const us=S.units.filter(u=>!u.dead).sort((a,b)=>a.pos.y-b.pos.y); // squash is monotonic in y, so logical-y sort order == screen-y sort order
  for(const u of us){
    const big=u.size>1;
    const p=toScreen(u.pos.x,u.pos.y);
    ctx.beginPath(); ctx.ellipse(p.x,p.y+HEX*0.34*TILT_SQUASH,HEX*(big?0.55:0.38),HEX*0.17*TILT_SQUASH,0,0,7);
    ctx.fillStyle=u.side?"rgba(192,57,43,.5)":"rgba(46,111,208,.5)"; ctx.fill();
    drawUnitSprite(u);
    hpBar(p.x,p.y-HEX*(big?1.05:0.78),HEX*(big?1.4:1.0),u.hp/u.maxhp,u.side?"#e3392b":"#3f9bff");
    ctx.font=`${HEX*0.45}px serif`;
    if(u.hold) ctx.fillText("⚓",p.x+HEX*0.6,p.y-HEX*0.5);
    if(now<u.stunUntil) ctx.fillText("💫",p.x,p.y-HEX*1.05);
    else if(now<u.buffUntil) ctx.fillText("✨",p.x+HEX*0.55,p.y-HEX*0.5);
  }
  for(let i=S.effects.length-1;i>=0;i--){
    const e=S.effects[i]; e.t+=1/60;
    const p=e.t/e.life;
    if(p>=1){ S.effects.splice(i,1); continue; }
    const s1=toScreen(e.x,e.y);
    if(e.kind==="tracer"){
      const s2=toScreen(e.x2,e.y2);
      ctx.strokeStyle=e.color; ctx.lineWidth=2; ctx.globalAlpha=1-p;
      ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke(); ctx.globalAlpha=1;
    } else if(e.kind==="ring"){
      const R=6+p*HEX*1.8;
      ctx.strokeStyle=e.color; ctx.lineWidth=2.5; ctx.globalAlpha=1-p;
      ctx.beginPath(); ctx.ellipse(s1.x,s1.y,R,R*TILT_SQUASH,0,0,7); ctx.stroke(); ctx.globalAlpha=1;
    } else if(e.kind==="boom"){
      const R=4+p*HEX*1.1;
      ctx.fillStyle=e.color; ctx.globalAlpha=(1-p)*0.8;
      ctx.beginPath(); ctx.ellipse(s1.x,s1.y,R,R*TILT_SQUASH,0,0,7); ctx.fill(); ctx.globalAlpha=1;
    } else if(e.kind==="heal"){
      ctx.fillStyle=e.color; ctx.globalAlpha=1-p;
      ctx.font=`${HEX*0.55}px serif`; ctx.fillText("＋",s1.x,s1.y-p*14); ctx.globalAlpha=1;
    } else if(e.kind==="spawn"){
      const R=3+p*HEX;
      ctx.strokeStyle=e.color; ctx.globalAlpha=1-p; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(s1.x,s1.y,R,R*TILT_SQUASH,0,0,7); ctx.stroke(); ctx.globalAlpha=1;
    } else if(e.kind==="text"){
      ctx.fillStyle=e.color; ctx.globalAlpha=1-p;
      ctx.font=`bold ${HEX*0.5}px sans-serif`; ctx.fillText(e.text,s1.x,s1.y-p*20); ctx.globalAlpha=1;
    }
  }
}

/* ================================================================
   RESIZE / END / MAIN LOOP
   ================================================================ */
/* Keeps #app itself phone-shaped (iPhone 14 Pro CSS viewport ratio, same device
   HANDOFF's board-sizing math is calibrated against) regardless of the actual
   browser window's shape — a wide/short desktop window used to leave the board
   (bound by whichever of width/height was tighter) narrower than the full-width
   bottom bar, since #app used to just fill height:100% of any window shape.
   Fit-inside-the-viewport, letterboxed like a real phone frame, not stretched. */
function fitAppToPhone(){
  const PHONE_W=393, PHONE_H=852;
  const maxW=Math.min(520, window.innerWidth), maxH=window.innerHeight;
  let w=maxW, h=w*PHONE_H/PHONE_W;
  if(h>maxH){ h=maxH; w=h*PHONE_W/PHONE_H; }
  const app=$("app");
  app.style.width=w+"px";
  app.style.height=h+"px";
}
function computeCamera(){
  const wrap=$("boardwrap"), W=wrap.clientWidth, H=wrap.clientHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  board.width=W*DPR; board.height=H*DPR;
  bg.width=W*DPR; bg.height=H*DPR;
  const rows=TMAP.length;
  // Terrain step: the floating palette panel sits at the top of the board area and would
  // otherwise cover part of the player's half — reserve its real rendered height as a top
  // inset so the board renders below it instead of underneath it.
  const topInset = S.setupStep==="terrain" ? ($("stepterrain").offsetHeight||0) : 0;
  const availH = H-topInset;
  // The camera tilt (TILT_SQUASH) renders the board TILT_SQUASH-times shorter than its
  // logical/unsquashed height, so the height budget below has that much more real room
  // than the raw formula alone would suggest -- without dividing by TILT_SQUASH here,
  // HEX stayed capped at the old (taller) height need even though less vertical space
  // is now actually used on screen, leaving the board narrower than the available width
  // for no reason (visible as blank margins on the sides).
  HEX=Math.min(W/(1.5*COLS+0.5), availH/(SQ3*(rows+0.5)*TILT_SQUASH));
  OX=(W-HEX*(1.5*COLS+0.5))/2;
  OY=topInset + (availH-HEX*SQ3*(rows+0.5))/2;
  renderBG();
}
function resize(){
  fitAppToPhone();
  computeCamera();
}
function checkInstantWin(){
  for(const side of [0,1])
    if(buildings.filter(b=>b.side===side&&b.dead).length===3){ endMatch(); return; }
}
function endMatch(){
  if(S.over) return; S.over=true;
  const pKills=buildings.filter(b=>b.side===1&&b.dead).length;
  const aKills=buildings.filter(b=>b.side===0&&b.dead).length;
  let win = pKills>aKills?1 : aKills>pKills?-1
          : S.bldDmg[0]>S.bldDmg[1]?1 : S.bldDmg[1]>S.bldDmg[0]?-1 : 0;
  $("endtitle").textContent = win>0?"⚜ VICTORY ⚜":win<0?"DEFEAT":"DRAW";
  $("endtitle").style.color = win>0?"#e8b84b":win<0?"#ff5b4d":"#ccc";
  $("enddetail").textContent =
    `Buildings destroyed — You: ${pKills}  Enemy: ${aKills}\n`+
    `Building damage dealt — You: ${Math.floor(S.bldDmg[0])}  Enemy: ${Math.floor(S.bldDmg[1])}`;
  $("endscreen").style.display="flex";
}

function applyFactionUI(){
  $("aititle").textContent=FACTIONS[S.aiFaction].aiTitle;
  $("subtitle").textContent=`${FACTIONS[S.playerFaction].name} vs ${FACTIONS[S.aiFaction].name} AI`;
}
function renderFactionPicker(){
  $("factionbtn-egypt").classList.toggle("selected", S.playerFaction==="egypt");
  $("factionbtn-china").classList.toggle("selected", S.playerFaction==="china");
  $("factionbtn-aztec").classList.toggle("selected", S.playerFaction==="aztec");
}
/* Setup is a three-step wizard, each its own full page ("faction" split out 2026-07-18,
   direct chat request — was folded into "units"; picking a faction first, before the
   loadout/hero/god pickers that faction drives, reads more naturally as its own step).
   Steps "faction" and "units" are both true full-screen pages — #menupanel goes opaque
   via .fullpage and blocks the whole board, since there's nothing to tap there. Step
   "terrain" shows ONLY the player's own half as its own standalone board (TMAP points
   at playerHalf.terrain, buildings render from playerHalf.buildings) — not a crop of the
   full arena. Leaving "terrain" composes playerHalf back into the live absolute TMAP/
   buildings the rest of the game already expects. */
function renderSetupStep(){
  const onFaction = S.setupStep==="faction";
  const onTerrain = S.setupStep==="terrain";
  const onUnits = !onFaction && !onTerrain;
  $("stepfaction").style.display = onFaction? "block":"none";
  $("stepunits").style.display = onUnits? "block":"none";
  $("stepterrain").style.display = onTerrain? "block":"none";
  $("menupanel").classList.toggle("fullpage", !onTerrain);
  if(onTerrain){ TMAP = playerHalf.terrain; }
  else { TMAP = composeAbsoluteTMAP(); composeAbsoluteBuildings(); }
  computeCamera();
}
function goToFactionStep(){ S.setupStep="faction"; renderSetupStep(); }
function goToUnitsStep(){ S.setupStep="units"; renderSetupStep(); }
function goToTerrainStep(){
  if(S.loadout.length!==4||S.heroPick.length!==2||S.godPick.length!==4){ hint("Pick exactly 4 warriors, 2 heroes, and 4 gods before continuing."); return; }
  S.setupStep="terrain"; renderSetupStep();
}
function setPlayerFaction(faction){
  if(faction===S.playerFaction) return;
  S.playerFaction=faction;
  // Aztec is player-only (see 7.8's sign-off) — the AI still only ever plays Egypt or China,
  // picked at random when the player picks Aztec; otherwise it's the simple binary complement.
  if(faction==="egypt") S.aiFaction="china";
  else if(faction==="china") S.aiFaction="egypt";
  else S.aiFaction = Math.random()<0.5 ? "egypt" : "china";
  S.loadout=[...FACTIONS[faction].defaultLoadout];
  S.heroPick=[...FACTIONS[faction].defaultHeroes];
  S.godPick=[...FACTIONS[faction].defaultGodPick];
  S.aiGodPick=[...FACTIONS[S.aiFaction].defaultGodPick];
  startMatch(false);
}
function startMatch(keepTerrain){
  applyFactionUI();
  S.t=180; S.over=false;
  S.food=60; S.favor=40; S.aiFood=60; S.aiFavor=40;
  S.units.length=0; S.effects.length=0; S.wards.length=0; S.deadHumans.length=0; S.training.length=0;
  S.bldDmg=[0,0];
  HUMAN_KEYS = Object.keys(FACTIONS[S.playerFaction].units).filter(k=>FACTIONS[S.playerFaction].units[k].cat==="human");
  HERO_KEYS = Object.keys(FACTIONS[S.playerFaction].units).filter(k=>FACTIONS[S.playerFaction].units[k].cat==="hero");
  S.heroPick = S.heroPick.filter(k=>HERO_KEYS.includes(k));
  if(S.heroPick.length!==2) S.heroPick=[...FACTIONS[S.playerFaction].defaultHeroes];
  const allAiHeroKeys = Object.keys(FACTIONS[S.aiFaction].units).filter(k=>FACTIONS[S.aiFaction].units[k].cat==="hero");
  aiHeroKeys = allAiHeroKeys.sort(()=>Math.random()-0.5).slice(0,2);
  activeGods = FACTIONS[S.playerFaction].allGods.filter(g=>S.godPick.includes(g.key));
  S.playerGods = {};
  activeGods.forEach(g=>{ S.playerGods[g.key]={unlocked:false,cdUntil:0}; });
  buildPlayerGodsUI();
  activeAiGods = FACTIONS[S.aiFaction].allGods.filter(g=>S.aiGodPick.includes(g.key));
  S.aiGods = {};
  activeAiGods.forEach(g=>{ S.aiGods[g.key]={unlocked:false,cdUntil:0}; });
  buildEnemyGodsUI();
  S.armedPower=null; S.drag=null; S.paintSelected=null;
  buildings.forEach(b=>{ b.hp=b.maxhp; b.dead=false; b.atkTimer=0; });
  DECK_INITIAL = [...S.loadout, ...S.heroPick];
  DECK.length=0; DECK.push(...DECK_INITIAL);
  aiTrainT=3; aiPowerT=8; aiHeroAt=55; aiTargetRot=0;
  const profileStyles=Object.keys(AI_PROFILES);
  const profileStyle=profileStyles[Math.floor(Math.random()*profileStyles.length)];
  aiProfile=AI_PROFILES[profileStyle][S.aiFaction];
  $("ainame").textContent=`${FACTIONS[S.aiFaction].label} — ${profileStyle[0].toUpperCase()}${profileStyle.slice(1)}`;
  if(!keepTerrain){ playerHalf.terrain=freshPlayerHalfTerrain(); S.painted={F:0,M:0,W:0}; S.paintMap={}; }
  $("endscreen").style.display="none";
  S.setupStep="faction";
  renderCards();
  refreshUI();
  renderFactionPicker();
  renderSetupStep();
  renderPalette();
  renderLoadout();
  renderHeroPicker();
  renderGodPicker();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!S.over && S.phase==="battle"){
    S.t-=dt;
    tickEconomy(dt);
    tickTraining();
    tickFortresses(dt);
    tickAI(dt);
    for(const u of S.units) updateUnit(u,dt);
    S.units=S.units.filter(u=>!u.dead);
    S.wards=S.wards.filter(w=>elapsed()<w.until&&w.charges>0);
    if(S.t<=0){ S.t=0; endMatch(); }
  }
  refreshUI();
  draw();
  requestAnimationFrame(loop);
}

/* ---------------- INIT ---------------- */
renderCards();
window.addEventListener("resize",resize);
if(typeof ResizeObserver!=="undefined") new ResizeObserver(()=>resize()).observe($("boardwrap"));
resize();
startMatch();
warmSpriteCache();
requestAnimationFrame(loop);
</script>
</body>
</html>
